<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubu Floating Lyrics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
    }
    .header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: #ffb7b2;
    }
    .track-info {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .controls {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 6px;
    }
    .controls button {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 12px;
    }
    .controls button:hover {
      color: #fff;
    }
    .lyrics-container {
      flex: 1;
      overflow: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .line {
      transition: all 0.3s ease;
      line-height: 1.6;
    }
    .line-prev {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 8px;
    }
    .line-current {
      font-size: 18px;
      font-weight: 700;
      color: #ffb7b2;
      transform: scale(1.05);
      text-shadow: 0 0 12px rgba(255, 183, 178, 0.6);
    }
    .line-next {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 8px;
    }
    .karaoke-bar {
      width: 80%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }
    .karaoke-progress {
      height: 100%;
      width: 0%;
      background: #ffb7b2;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="track-info" id="trackTitle">🎵 Waiting for music...</div>
    <div class="controls">
      <button id="btnPin" title="Pin Always on Top">📌</button>
      <button id="btnClose" title="Close Overlay">✕</button>
    </div>
  </div>

  <div class="lyrics-container">
    <div class="line line-prev" id="linePrev">...</div>
    <div class="line line-current" id="lineCurrent">Bubu Desktop Companion</div>
    <div class="line line-next" id="lineNext">Play a song to begin</div>
    <div class="karaoke-bar">
      <div class="karaoke-progress" id="karaokeProgress"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
