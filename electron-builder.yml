appId: com.bubu.desktop
productName: Bubu Desktop Companion
directories:
  output: release/
files:
  - apps/desktop-pet/dist/**/*
  - packages/*/dist/**/*
  - packages/*/package.json
  - node_modules/**/*
  - dist/**/*
  - assets/**/*

linux:
  target:
    - AppImage
  category: Utility

win:
  target:
    - target: nsis
      arch:
        - x64
