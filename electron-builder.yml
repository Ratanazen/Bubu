appId: com.bubu.desktop
productName: Bubu Desktop Companion
directories:
  output: release/
files:
  - apps/desktop-pet/dist/**/*
  - dist/**/*
  - assets/**/*

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Bubu Desktop Companion"

mac:
  target: dmg
  category: public.app-category.entertainment
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - AppImage
  category: Utility
